name: Build QMK Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install QMK
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi avr-libc gcc-avr avrdude dfu-programmer dfu-util dos2unix make
          pip install qmk --break-system-packages
          qmk setup -H ~/qmk_firmware -y
          
      - name: Copy keyboard files
        run: |
          cp -r pyae2014k ~/qmk_firmware/keyboards/
          
      - name: Compile
        run: |
          cd ~/qmk_firmware
          make pyae2014k:default 2>&1
          ls -la *.uf2 || echo "No uf2 found in root"
          ls -la .build/ || echo "No .build directory"
          
      - name: Find all build files
        run: find /home/runner/qmk_firmware -name "*.bin" -o -name "*.hex" -o -name "*.uf2" 2>/dev/null

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/qmk_firmware/*.uf2
