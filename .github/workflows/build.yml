name: Build QMK Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install QMK
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip install qmk
          qmk setup -H ~/qmk_firmware -y
          
      - name: Copy keyboard files
        run: |
          cp -r pyae2014k ~/qmk_firmware/keyboards/
          
      - name: Compile
        run: |
          cd ~/qmk_firmware
          make pyae2014k:default
          
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/qmk_firmware/*.uf2
